name = "radiant-research-cloud"
main = "src/worker.js"
compatibility_date = "2026-11-17"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "radiant-research-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
# Runs every 15 minutes. Each invocation processes a small, resumable batch.
crons = ["*/15 * * * *"]
